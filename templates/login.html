<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - DataCleaner Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen">
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl max-w-md w-full">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-sky-400 tracking-tight">DataCleaner Pro</h1>
            <p class="text-slate-400 text-sm mt-2">Higienização e ordenação inteligente de leads</p>
        </div>

        {% if erro %}
        <div class="bg-rose-500/10 border border-rose-500/30 text-rose-400 text-sm p-3 rounded-xl mb-4 text-center">
            {{ erro }}
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">E-mail de Acesso</label>
                <input type="email" name="email" required placeholder="seu@email.com" class="w-full bg-slate-800 border border-slate-700 text-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:border-sky-500 transition">
            </div>
            <div>
                <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Palavra-passe / Senha</label>
                <input type="password" name="senha" required placeholder="••••••••" class="w-full bg-slate-800 border border-slate-700 text-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:border-sky-500 transition">
            </div>
            <button type="submit" class="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold py-3 rounded-xl transition duration-200 shadow-lg shadow-sky-500/20 mt-2">
                Aceder à Plataforma
            </button>
        </form>
    </div>
</body>
</html>
