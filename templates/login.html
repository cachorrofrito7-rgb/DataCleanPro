<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><title>DataCleaner - Login</title><style>body{font-family:sans-serif;background:#f4f7f6;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;}.card{background:#fff;padding:30px;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,0.1);width:300px;}input,button{width:100%;padding:10px;margin:10px 0;border:1px solid #ccc;border-radius:5px;}button{background:#007bff;color:#white;border:none;cursor:pointer;}button:hover{background:#0056b3;}.erro{color:red;font-size:14px;}</style></head>
<body><div class="card"><h2>DataCleaner</h2><form action="/login" method="POST"><input type="email" name="email" placeholder="E-mail" required><input type="password" name="senha" placeholder="Senha" required><button type="submit">Entrar</button>{% if erro %}<p class="erro">{{ erro }}</p>{% endif %}</form></div></body></html>
