<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Liberado - DataCleaner</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen">
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl max-w-md w-full text-center">
        <div class="inline-block p-3 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 rounded-full text-3xl mb-4">✅</div>
        <h2 class="text-2xl font-bold text-emerald-400 mb-2">Pagamento Aprovado!</h2>
        <p class="text-slate-400 text-sm mb-6">O seu ficheiro foi higienizado, corrigido e ordenado alfabeticamente com sucesso.</p>
        
        <form action="/processar_e_baixar" method="POST">
            <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3.5 rounded-xl transition duration-200 shadow-lg shadow-emerald-500/20 text-base mb-4 flex items-center justify-center gap-2">
                <span>⬇️ Baixar Ficheiro Limpo Agora</span>
            </button>
        </form>

        <a href="/painel" class="block text-xs text-slate-500 hover:text-slate-400 transition">Processar outro ficheiro</a>
    </div>

</html>
